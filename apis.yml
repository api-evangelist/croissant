aid: croissant
name: Croissant
description: Croissant is the workspace infrastructure layer for distributed teams,
  letting companies find, book, and manage on-demand access to 700+ coworking spaces
  across 100+ cities without long-term leases. Founded in 2015, the platform pairs
  instant workspace booking with spend governance, centralized policy controls, vendor
  consolidation, and usage-intelligence reporting, giving finance and people teams
  real-time control over where and how their people work. Croissant serves early-stage,
  scaling, and enterprise organizations, and exposes Slack, HRIS, stipend, and ERP
  integrations plus a custom API and integrations on its enterprise tier.
